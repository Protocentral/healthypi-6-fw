# M4 algorithm core: OpenAMP + CMSIS-DSP (calculations only).
# Arrhythmia ML classification runs on the HealthyLink Compute (NPU) module.

# CONFIG_IPM is not set
CONFIG_MBOX=y
CONFIG_MBOX_STM32_HSEM=y

# IPC Service Configuration - OpenAMP/RPMSG Backend
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG=y
CONFIG_IPC_SERVICE_STATIC_VRINGS=y
CONFIG_IPC_SERVICE_RPMSG=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y

# Memory allocation
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Use immediate mode logging to bypass log thread (for debugging)
# This ensures logs appear in real-time, not buffered
CONFIG_LOG_MODE_IMMEDIATE=y

# CMSIS-DSP for HRV frequency domain analysis
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y

# FPU support (Cortex-M4 has single-precision FPU)
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# =============================================================================
# Runtime / stack configuration
# =============================================================================
# HRV FFT (CMSIS-DSP) + IPC use significant stack; keep a generous main stack.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_REQUIRES_FLOAT_PRINTF=y

# Fault handling - print info before reset on crashes
CONFIG_EXCEPTION_DEBUG=y
CONFIG_FAULT_DUMP=2

# Stack overflow detection
CONFIG_STACK_SENTINEL=y

# =============================================================================
# Boot debugging - help identify where freeze occurs
# =============================================================================
CONFIG_EARLY_CONSOLE=y
CONFIG_BOOT_BANNER=y
CONFIG_BOOT_DELAY=0
CONFIG_PRINTK=y

CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_FPU=y