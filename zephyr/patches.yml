# Patches this project carries on top of the modules in west.yml.
#
# Applied by `west patch apply` (Zephyr's west extension; it reads this file
# from the manifest repo). scripts/build.sh applies them itself when they are
# missing, so a plain `scripts/build.sh signed` after `west update` works.
# `west update` resets a module and drops its patches; build.sh puts them back.
#
# Keep each patch small and say here why it exists and what fails without it.

patches:
  - path: mcuboot/0001-zephyr-keys-allow-an-external-key-table.patch
    sha256sum: c4e089a4e6b67a6f2586135c4d6ed21c1ea270d7d82ac49c44f1c74ba714194a
    module: mcuboot
    author: Ashwin K Whitchurch
    email: ashwin@protocentral.com
    date: 2026-11-22
    upstreamable: true
    apply-command: git apply
    comments: |
      MCUboot's Zephyr port builds a one-entry public-key table from
      CONFIG_BOOT_SIGNATURE_KEY_FILE (boot/zephyr/keys.c), although its
      verifier, bootutil_find_key(), already searches a table by key hash.
      This lets the build supply the table instead, when MCUBOOT_KEYS_EXTERNAL
      is defined. HealthyPi 6 uses it to put a backup release key in the
      bootloader (keys/README.md, "Backup key"): the table is generated by
      this repo's module CMakeLists.txt.
      Without the patch, a build that asks for a backup key fails to link
      (bootutil_keys defined twice) rather than silently shipping one key.
