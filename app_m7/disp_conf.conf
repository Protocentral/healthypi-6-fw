# HealthyPi 6 — display/LVGL flavor overlay.
# Applied on top of prj.dev.conf by scripts/make_m7_disp.sh together with the
# display-gc9503v.overlay. Enables the GC9503V/LVGL/GT911 stack and compiles the
# modular ui/ layer (CONFIG_HPI_DISPLAY_ENABLED). Default builds stay headless.
CONFIG_HPI_DISPLAY_ENABLED=y

# Need the M3 widget set + flex layout. The redesign UI uses the real design
# faces (Rubik/Manrope/Saira/JetBrains) from src/ui/fonts/; the only Montserrat
# weights still needed are the LVGL default (14) and the LV_SYMBOL glyph carrier
# (16, = HPI_M3_FONT_SYMBOL). Larger weights were dropped in P9.
CONFIG_LV_USE_FLEX=y
CONFIG_LV_FONT_MONTSERRAT_14=y

CONFIG_MEMC=y

CONFIG_DISPLAY=y

# Backlight dimming: TPS61185 control pin (PC6) driven as TIM3_CH1 PWM via the
# LED-PWM API (led_set_brightness 0-100%).
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

CONFIG_INPUT=y
CONFIG_INPUT_GT911_INTERRUPT=y
CONFIG_INPUT_INIT_PRIORITY=82

# Touch queue depth. Losing a touch event here is NOT a dropped frame -- it can
# wedge the UI. Zephyr's LVGL glue repeats the last event whenever its queue is
# empty (lvgl_common_input.c, lvgl_input_read_cb), so if the BTN_TOUCH=0 that
# ends a press is the one dropped, LVGL keeps reading PRESSED forever: the widget
# under the finger at that moment stays captured, every later touch is delivered
# to it as a continued drag, and nothing else on the screen responds again.
#
# The GT911 reports ~119 Hz and emits three input events per sample (ABS_X,
# ABS_Y, BTN_TOUCH+sync), so the defaults -- 16 input events (~5 samples) and 10
# LVGL events -- only cover ~50-80 ms of the UI thread not draining. Size both
# for a ~250 ms stall instead: 96 input events (32 samples) and 32 LVGL events.
# Costs ~1.5 KB and ~0.5 KB of RAM respectively.
CONFIG_INPUT_QUEUE_MAX_MSGS=96
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=32

# NB: the screen auto-cycle (CONFIG_HPI_UI_DEBUG_CYCLE) used to be forced on
# here, because GT911 touch did not answer on I2C4 and there was no way to leave
# the Home screen. Touch works now, so navigation belongs to the user again and
# the option is back to its Kconfig default (n). It is still needed to measure
# the LVGL heap across the whole screen set — app_m7/disp_debug.conf turns it on.

# From LVGL sample
CONFIG_LVGL=y

# LVGL heap (a private sys_heap in .bss, NOT the Zephyr system heap; see
# zephyr/modules/lvgl/lvgl_mem.c). Measured on v5 hardware with
# CONFIG_SYS_HEAP_RUNTIME_STATS + app_m7/disp_debug.conf, cycling all 10 screens:
#
#   ui_build() alone (10 screens + navbar + boot overlay) .....  99,228 B
#   steady state, any one screen up ........................... ~100,200 B
#   high-water across a full screen cycle (render peak) ....... 176,048 B
#
# The old value was 96,000 -- below even the build figure. It did not degrade
# gracefully: lv_malloc/lv_realloc return NULL, LVGL carries the NULL (its
# LV_ASSERT_MALLOC handler is a bare `while(1);` that is compiled to nothing
# unless CONFIG_LV_USE_LOG is on), and the UI thread bus-faulted a few frames
# later inside a memcpy or in sys_heap_free on a corrupted chunk. That is the
# boot crash this replaced. Keep real headroom over 176 KB -- an LVGL OOM here
# corrupts the heap, it does not just drop a frame.
#
# NB: the `.sram1_lvgl_pool` slot in boards/.../dc_ram.ld is NOT a home for this.
# sram1 is the M4's RAM (`zephyr,sram = &sram1` in the M4 DTS); sram2 is mapped
# nocache for DMA. The pool stays in the M7's own AXI SRAM (sram0).
CONFIG_LV_Z_MEM_POOL_SIZE=240000

# Report LVGL allocation failures instead of failing silently. Without this
# LV_USE_LOG is off, LV_LOG_ERROR compiles away, and an out-of-memory condition
# shows up only as a bus fault with no indication of the cause. Error level only.
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_ERROR=y
CONFIG_LV_COLOR_DEPTH_16=y
# Flush thread OFF: with FULL_REFRESH + double VDB, doing the vsync framebuffer
# swap on a separate thread lets LVGL start painting the next frame into a buffer
# that is still being scanned out -> a repaint that visibly sweeps top->bottom
# (rolling tear), worse as render load rises. Disabling it makes the UI thread do
# render -> vsync-swap -> render strictly in lockstep, so the displayed buffer is
# never being painted.
CONFIG_LV_Z_FLUSH_THREAD=n

CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=100

CONFIG_STM32_LTDC_RGB565=y

CONFIG_DISPLAY_GC9503V_DSI_INIT_PRIORITY=87

# FB_NUM left at default 1: with LV_Z_FULL_REFRESH + DOUBLE_VDB the LVGL VDBs are
# used directly as the two framebuffers (zero-copy, swapped at a scan-line IRQ by
# the LTDC driver), so a 2nd driver framebuffer is never used in this mode.
#CONFIG_STM32_LTDC_FB_NUM=2
CONFIG_STM32_LTDC_DISABLE_FMC_BANK1=y
CONFIG_INPUT_GT911_INTERRUPT=y

# LVGL Font Options — only Montserrat 16 (LV_SYMBOL glyph carrier). All larger
# weights were dropped in P9 (the redesign UI uses the real design faces from
# src/ui/fonts/; Montserrat 14 is kept as the LVGL default above).
CONFIG_LV_FONT_MONTSERRAT_16=y

# DMA2D is OFF. It corrupts the LVGL heap on this build, and the mode we can
# actually run it in is structurally unable to be safe.
#
# Symptom: a bus fault on the UI thread inside sys_heap_free()/sys_heap_alloc()
# on the LVGL heap, with a 16-bit chunk field reading 0xFFFF --
#
#   <err> os: ***** BUS FAULT *****  Imprecise data bus error
#   r3/a4: 0x0000ffff   r1/a2: 0x240892f8   (= lvgl_heap_mem + 8*0xFFFF)
#   PC -> merge_chunks() inlined in sys_heap_free()
#
# 0xFFFF is not garbage: in RGB565 it is opaque white, i.e. DMA2D fill output
# landing in memory that is no longer the buffer it was aimed at.
#
# Why it cannot be made safe here: LV_DRAW_DMA2D_ASYNC is (LV_USE_DRAW_DMA2D_INTERRUPT
# && LV_USE_OS), and the interrupt option needs a DMA2D ISR calling
# lv_draw_dma2d_transfer_complete_interrupt_handler(). Nothing in Zephyr's LVGL
# integration or this tree connects that IRQ, so we run with ASYNC=0 -- and in
# that mode lv_draw_dma2d_init() never registers wait_for_finish_cb (it is inside
# `#if LV_DRAW_DMA2D_ASYNC`). That callback is how LVGL forces a draw unit to
# finish before a layer's buffer is released, so nothing synchronises the
# hardware against the free. dispatch_cb() starts a transfer and returns; the
# completion is only ever noticed on a LATER dispatch_cb(). Several of its early
# returns also leave task_act set with no transfer started, and the next dispatch
# then runs post_transfer_tasks() against a writing_area left over from the
# previous transfer -- cache maintenance aimed at a buffer that may already be
# freed and reallocated.
#
# It only bit on screens that build a layer -- the lv_obj_set_style_clip_corner()
# segmented controls on Settings and Record. Everything else renders straight to
# the framebuffers, which live in SDRAM and are never freed.
#
# Cost: blits and fills run on the software blender, so rendering is slower. The
# UI is well inside budget without it. To get the acceleration back, write the
# DMA2D ISR + IRQ_CONNECT, set CONFIG_LV_USE_DRAW_DMA2D_INTERRUPT=y, and keep the
# alignment below -- do not just flip DMA2D back on.
CONFIG_LV_USE_DRAW_DMA2D=n

# Prerequisite for ever re-enabling DMA2D, kept so it cannot be forgotten. LVGL's
# DMA2D unit calls SCB_InvalidateDCache_by_Addr()/SCB_CleanDCache_by_Addr() on its
# buffers (LV_DRAW_DMA2D_CACHE=1 on Cortex-M7), and those act on whole 32-byte
# lines (CONFIG_DCACHE_LINE_SIZE). At the LVGL defaults (ALIGN=4, STRIDE_ALIGN=1)
# a heap-allocated layer buffer starts and ends mid-line, so the maintenance ops
# reach into the neighbouring sys_heap chunk headers. 32 on both makes a buffer
# occupy whole cache lines exactly. Necessary but NOT sufficient -- it does not
# address the missing wait_for_finish_cb above. Harmless with DMA2D off (a little
# padding per draw buffer); the software blender does no cache maintenance.
CONFIG_LV_DRAW_BUF_ALIGN=32
CONFIG_LV_DRAW_BUF_STRIDE_ALIGN=32