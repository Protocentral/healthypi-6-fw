# HealthyPi 6 — display/UI screen auto-cycle fragment.
#
#     HPI_EXTRA_CONF="disp_debug.conf;disp_cycle.conf" scripts/build.sh m7 dev
#
# Walks the UI through every screen on a timer instead of waiting for touch.
# Pair it with disp_debug.conf to get the LVGL heap high-water across the whole
# screen set — rendering allocates well past what ui_build() reserves, so the
# peak only shows up if every screen is actually drawn.
#
# Kept OUT of disp_debug.conf on purpose: this takes navigation away from the
# user, so it fights any bug you are trying to reproduce by hand. Use it for
# unattended measurement, not for interactive debugging.
CONFIG_HPI_UI_DEBUG_CYCLE=y
CONFIG_HPI_UI_DEBUG_CYCLE_MS=3000
