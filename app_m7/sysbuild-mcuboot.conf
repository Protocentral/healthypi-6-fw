# Sysbuild fragment that turns on MCUboot for the signed build (M7-only,
# image 0; the M4 has its own update path through the M7).
# OPT-IN: passed explicitly by scripts/build.sh signed (-DSB_EXTRA_CONF_FILE=...);
# NOT auto-loaded, so default builds (scripts/build.sh m7) are unaffected.

SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Cross-device secondary (internal primary, QSPI secondary) -> overwrite-only;
# swap needs same-device scratch, which we don't have.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# NOTE: SB_CONFIG_MCUBOOT_UPDATEABLE_IMAGES is an NCS-only symbol and
# does NOT exist in vanilla Zephyr sysbuild. Multi-image (M4 = image 1) is
# enabled by setting CONFIG_UPDATEABLE_IMAGE_NUMBER=2 in the MCUboot image
# (app_m7/sysbuild/mcuboot.conf) + CONFIG_UPDATEABLE_IMAGE_NUMBER=2 in the app.

# ECDSA-P256 signing. The key file is passed as an ABSOLUTE path by
# scripts/build.sh signed (-DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=...): a relative
# path here would resolve against the west topdir / MCUboot repo, not this repo.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
