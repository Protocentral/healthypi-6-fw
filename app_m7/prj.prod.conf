# Customer (production) flavor. Build with:
#   west build ... -- -DEXTRA_CONF_FILE=prj.prod.conf
# No shell; minimal logs. tools/ci/check_prod_surface.sh asserts that the
# shell/fs/log MCUmgr groups are absent.

CONFIG_HPI_DEV_MODE=n
CONFIG_SHELL=n
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=2

# Our own modules' level. CONFIG_LOG_DEFAULT_LEVEL above does NOT cover them:
# every HealthyPi module passes an explicit level to LOG_MODULE_REGISTER, and an
# explicit level overrides the default. Until this symbol existed the line above
# trimmed nothing and the shipping image logged as much as a dev build — the boot
# log was indistinguishable (found on hardware).
# 2 = warnings and errors only.
CONFIG_HPI_APP_LOG_LEVEL=2

# --- lock down the production attack/debug surface ---
# Belt-and-suspenders: the dev aids live in prj.dev.conf (not merged for the prod
# flavor) and the remote fs/shell mgmt groups default off -- but pin them OFF
# explicitly so the prod image's surface is unambiguous and
# tools/ci/check_prod_surface.sh can assert it from the merged .config.

# No remote filesystem or shell management surface over MCUmgr/SMP.
CONFIG_MCUMGR_GRP_FS=n
CONFIG_MCUMGR_GRP_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n

# No dev/bring-up aids in a shipped image.
CONFIG_HPI_BUS_SELFTEST=n
CONFIG_HPI_ACQ_DEBUG=n
CONFIG_HPI_HEARTBEAT_LOG=n
CONFIG_THREAD_ANALYZER=n
CONFIG_HPI_SPI4_LOOPBACK_TEST=n
CONFIG_HPI_NPU_COMMS_CHECK=n
CONFIG_HPI_CONN_DEBUG=n
CONFIG_HEALTHYBRIDGE_ESP32_DEBUG=n

# --- USB identity ---
#
# pid.codes VID 0x1209, PID 0xFF90 — the pair applied for. Replaces the Zephyr
# development default (0x2FE3/0x0100), which is fine on a bench and not on a
# product.
#
# PROVISIONAL: the pid.codes allocation had not been confirmed when this was
# set (2026-07-27). It is the PID applied for, adopted so the rest of the
# release path could be finished rather than waiting on an external queue. If
# the allocation comes back different, this line, mcuboot.conf and
# docs/FIRMWARE_UPDATE.md move together — grep 0xFF90.
#
# The MCUboot recovery port carries the SAME VID/PID. pid.codes allocates one
# PID per entry, and the earlier plan of PID+1 for recovery would have meant
# using 0xFF91, which is not ours.
#
# Nothing needs them to differ. Both ports enumerate regardless, and anything
# that must know which one it is asks the PROTOCOL: the application answers
# group 64, the bootloader does not. `healthypi fw recover` probes exactly that
# and reports a wrong port before writing anything. Descriptor identity was
# never load-bearing -- the PID appeared in one line of operator guidance and
# nowhere in code.
CONFIG_HPI_USB_VID=0x1209
CONFIG_HPI_USB_PID=0xFF90

# --- Device lock/unlock posture (v1: SHIP UNLOCKED) ---
#
# CONFIG_HPI_SECURITY stays off for v1. Recorded decision, not an oversight.
# Summary: firmware
# authenticity is enforced by MCUboot's ECDSA-P256 verification, which does not
# depend on the unlock gate; the unlock gate protects against a *local USB*
# actor, and it cannot be made meaningful until the per-device secret is
# provisioned in OTP (unimplemented — HPI_UNLOCK_SECRET_SOURCE_OTP fails closed).
# Enabling it with the Kconfig secret would give every unit the same secret,
# which is worse than off because it looks like protection. check_prod_surface.sh
# rejects that combination explicitly.
CONFIG_HPI_SECURITY=n

# Pin the EOL self-test suite version a shipped unit reports (group-64 0x0080).
# Bump deliberately when the manufacturing check set changes.
CONFIG_HPI_EOL_SUITE_VER=1

# MCUboot/signed builds are NOT enabled by flavor — they are the separate
# opt-in signed layer: scripts/build.sh signed stacks prj.signed.conf on top of
# this flavor (works for prod too: FLAVOR=prod scripts/build.sh signed).
# (CONFIG_BOOT_SECURITY_COUNTER does not exist in this MCUboot — anti-rollback
# is CONFIG_MCUBOOT_DOWNGRADE_PREVENTION on the MCUboot image.)
