# Respiration bring-up fragment. Layer on a dev build:
#   HPI_EXTRA_CONF=resp_debug.conf scripts/build.sh m7 dev
# Logs raw CH1 (respiration) statistics every 5 s. Tune the AFE with
# CONFIG_SENSOR_ADS129XX_RESP_PHASE (0..6) and CONFIG_SENSOR_ADS129XX_RESP_GAIN.
# Also logs the respiration-rate detector's filtered amplitude, threshold and
# rate ("resp dbg:") every 5 s; use it to pick CONFIG_HPI_RESP_MIN_AMP_UV, e.g.
#   CONFIG_HPI_RESP_MIN_AMP_UV=20
CONFIG_HPI_RESP_DEBUG=y
