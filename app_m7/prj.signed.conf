# Signed/MCUboot app-image fragment — layered LAST by scripts/build.sh signed
# (EXTRA_CONF_FILE="prj.<flavor>.conf;disp_conf.conf;prj.signed.conf").
# Overrides prj.conf's CONFIG_BOOTLOADER_MCUBOOT=n; sysbuild's MAIN image
# defaults force the same =y, this keeps the intent explicit and greppable.

CONFIG_BOOTLOADER_MCUBOOT=y

# MCUmgr image group (stock group 1) over the existing CDC1 SMP transport —
# this is what HealthyPi Studio's "Update from file" talks to.
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_MUTEX=y
CONFIG_MCUMGR_GRP_IMG_VERBOSE_ERR=y
CONFIG_STREAM_FLASH=y      # IMG_MANAGER depends on it (silently dropped otherwise)
CONFIG_IMG_MANAGER=y

# The secondary slot (slot1) is on the QSPI NOR (4 KB sectors): erase as the
# upload advances instead of one long up-front erase, keeping CDC1 responsive.
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# FLASH / FLASH_MAP / FLASH_PAGE_LAYOUT / FLASH_STM32_QSPI are already =y in
# prj.conf (LittleFS on the same QSPI part); img_mgmt reuses that driver and
# the flash API locking serializes it against /lfs traffic.

# M4 firmware update through the M7 (group-64 0x00A0-0x00A4).
# Signed flavor only -- it needs m4_staging_partition from the MCUboot slot map.
CONFIG_HPI_M4_UPDATE=y

# Recovery-mode entry (group-64 0x00A5 hpi/enter_recovery). Writes the retained
# boot-mode flag that MCUboot's CONFIG_BOOT_SERIAL_BOOT_MODE reads, then reboots
# into serial recovery over USB CDC. Signed flavor only: without MCUboot there
# is nothing on the other end of the flag. The retention area itself is declared
# in the shared bootmode dtsi, included by both images.
CONFIG_HPI_RECOVERY_MODE=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
# The retention stack sits on backup SRAM, whose driver enables the D3 clock and
# the backup regulator at PRE_KERNEL_1 priority 90. The stock retained-mem (40)
# and retention (86) priorities both land BEFORE that, which
# check_init_priorities.py rejects outright ("initialized before its
# dependency"). Order them after their memory.
CONFIG_RETAINED_MEM_INIT_PRIORITY=91
CONFIG_RETENTION_INIT_PRIORITY=92
