# Base config — the always-on minimum.
# Build flavor is selected by an EXTRA_CONF_FILE fragment:
#   prj.dev.conf  (developer)  or  prj.prod.conf  (customer).

# --- Kernel / memory ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
# Sample-bus ring storage is k_malloc'd from this heap for now. When high-rate
# consumers + UI land and SRAM tightens, move the ring pool to SDRAM.
CONFIG_HEAP_MEM_POOL_SIZE=65536

# --- Fault handling (print before reset) ---
# Note: there is no CONFIG_RESET_ON_FATAL_ERROR in Zephyr — to reboot on a
# fatal fault, implement k_sys_fatal_error_handler() and call sys_reboot()
# (CONFIG_REBOOT enables that API).
CONFIG_EXCEPTION_DEBUG=y
CONFIG_FAULT_DUMP=2
CONFIG_STACK_SENTINEL=y
CONFIG_REBOOT=y

# --- Logging / console (UART for bring-up) ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- Device identity (STM32 UID for serial / device_info) ---
CONFIG_HWINFO=y

# --- battery telemetry (MAX17048 fuel gauge over I2C) ---
CONFIG_I2C=y
CONFIG_FUEL_GAUGE=y
CONFIG_MAX17048=y

# --- Hardware watchdog (IWDG) ---
CONFIG_WATCHDOG=y

# --- Storage: SD over SDMMC + FAT (FS-ready gate in fs_mount.c) ---
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_STM32_HWFC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# --- persistent settings on the QSPI-flash LittleFS (/lfs) ---
# lfs_partition (64 MB) on w25q01jv is auto-mounted at /lfs via zephyr,fstab.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_STM32_QSPI=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
# Per-open-file cache pool for LittleFS. Each open file needs cache-size (4096 B)
# from here; too small -> file open fails with -ENOMEM (-12). Sized for the
# settings file + headroom.
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=16384
# The single user button (PI3). In the base config, not the display fragment:
# a hardware button is a device feature, and a headless build still has to mark
# a recording and power down. CONFIG_INPUT is also what the GT911 touch driver
# needs, so the display flavor layers on top of this rather than enabling it.
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/settings"
CONFIG_SETTINGS_RUNTIME=y
# Host read/write of settings keys over the stock MCUmgr settings group.
CONFIG_MCUMGR_GRP_SETTINGS=y

# --- Data bus: event plane (zbus). Sample bus is plain C (no Kconfig). ---
CONFIG_ZBUS=y

# --- M4 IPC (OpenAMP/RPMSG over HSEM mailboxes) for vitals ---
CONFIG_MBOX=y
CONFIG_MBOX_STM32_HSEM=y
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG=y
CONFIG_IPC_SERVICE_STATIC_VRINGS=y
CONFIG_IPC_SERVICE_RPMSG=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
# Robustness: the RPMSG backend workqueue ("mbox_wq") was measured at 95%
# stack (44 B free / 1024) by the thread analyzer under load -- one deep call
# from a fault. Give it headroom.
CONFIG_IPC_SERVICE_BACKEND_RPMSG_WQ_STACK_SIZE=2048

# --- onboard acquisition (ECG ADS1294R + PPG AFE4400 over SPI) ---
CONFIG_GPIO=y
CONFIG_SPI=y
# CONFIG_SPI_ASYNC intentionally NOT enabled: nothing uses spi_transceive_signal,
# and async + CONFIG_SPI_STM32_INTERRUPT is a known-buggy combo on STM32
# (zephyrproject-rtos/zephyr#50501). Removed during SPI4 fault investigation.
CONFIG_SPI_STM32_INTERRUPT=y
CONFIG_SENSOR=y

# --- NPU transport over USART2 (replaces parked SPI4) ---
# Interrupt-driven RX for the framed NPU UART link (USART2 @ 1 Mbaud, RTS/CTS).
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_SENSOR_ADS129XX=y
CONFIG_SENSOR_AFE4400=y

# --- USB composite (usb_device_next) — CDC0 stream + CDC1 mcumgr ---
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y
# USB MSC (mass storage) class for Transfer Mode. The LUN is defined
# over the "SD" disk; it starts DISARMED (unregistered) and is armed on demand.
CONFIG_USBD_MSC_CLASS=y
# Quiet the chatty USB logs (bus-reset spam during host probing).
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_ERR=y

# --- MCUmgr / SMP over CDC1 (zephyr,uart-mcumgr chosen -> cdc_acm_uart1) ---
# CDC1 carries SMP request/response; the uart_mcumgr driver binds the chosen
# node automatically. Group 64 (control/mcumgr_hpi) registers via
# MCUMGR_HANDLER_DEFINE. MCUboot/IMG + FS/SETTINGS/STAT groups come later.
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_UART_MCUMGR=y
CONFIG_UART_MCUMGR_RX_BUF_COUNT=8
CONFIG_UART_MCUMGR_RX_BUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
# Stock OS group: echo / reset / mcumgr_params + datetime (6b).
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
# RTC datetime get/set. The STM32 RTC needs tm_wday, which the stock
# handler leaves unset -> control/mcumgr_hpi/hpi_datetime_hook.c fills it.
CONFIG_RTC=y
CONFIG_MCUMGR_GRP_OS_DATETIME=y
CONFIG_MCUMGR_GRP_OS_DATETIME_HOOK=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y

# --- App banner / version ---
CONFIG_HPI_APP_BANNER=y
CONFIG_BOOTLOADER_MCUBOOT=n

# --- Connectivity: ESP32-C6 WiFi/BLE via HealthyBridge SPI ---
# Mainline: the connectivity bus-consumer service streams ECG/PPG/vitals to the
# ESP32-C6 (SPI2 master) for WiFi TCP + BLE GATT, and proxies WiFi control via
# the group-64 wifi_* commands. The DT node healthybridge_esp32_uart is "okay" by
# default (board DTS). If the ESP32 is absent the driver reports "not ready" and
# the service stays idle -- safe to leave on. The 5 s SPI link-stats log is a
# dev-only aid (CONFIG_HPI_CONN_DEBUG in prj.dev.conf).
CONFIG_HPI_CONNECTIVITY=y

# Non-cached RAM region for UART DMA buffers (healthybridge ESP32 link).
# Since Zephyr 4.4 the stm32 SPI driver does no cache maintenance on DMA —
# cached TX buffers silently DMA stale (zero) RAM. See the driver comment.
CONFIG_NOCACHE_MEMORY=y
