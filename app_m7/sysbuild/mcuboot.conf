# MCUboot child-image (bootloader) config for the HealthyPi 6 signed build.
# Applied to the MCUboot image by sysbuild.
# OPT-IN path only (scripts/build.sh signed); not used by default builds.

# --- signing + anti-rollback ---
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_SIGNATURE_TYPE_NONE=n
# SW version-based downgrade prevention. (CONFIG_BOOT_SECURITY_COUNTER does not
# exist in this MCUboot; the HW security-counter variant needs a counter backend
# plain STM32H7 doesn't provide — OTP-backed counter is a documented later item.)
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# --- overwrite-only: secondary is on a different flash device (QSPI) ---
CONFIG_BOOT_UPGRADE_ONLY=y

# --- robustness: feed the IWDG through the (potentially slow QSPI) copy ---
CONFIG_BOOT_WATCHDOG_FEED=y
# EXPLICIT sector bound — do NOT rely on BOOT_MAX_IMG_SECTORS_AUTO here: on HW
# it derived 8 from the primary slot's 128 KB sectors (896 KB/128 KB), but the
# binding count is the QSPI secondary's 896 KB / 4 KB = 224. AUTO=8 bricked
# boot ("Failed reading sectors… / Unable to find bootable image").
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=512

# An M4-as-image-1 layout would set this to 2 (image 0 = M7 slot0/slot1, image 1 = M4
# slot2/slot3), using the MCUboot-image symbol -- SB_CONFIG_MCUBOOT_UPDATEABLE_IMAGES
# is NCS-only and silently does nothing in vanilla Zephyr sysbuild.
#
# It stays at 1 until the boot gating lands, because the two are COUPLED and
# cannot be deployed separately (learned on hardware):
#
#   * With 2 images MCUboot validates both primaries and refuses to boot ANY
#     image if one is invalid -- so it demands a signed image in slot2.
#   * But a signed image cannot live in slot2 while BCM4=1. The M4 auto-boots
#     from the bank-2 base, which is exactly where imgtool puts the 0x400
#     MCUboot header, so the M4 would execute the header instead of its vector
#     table (which sits at +0x400) and fault immediately.
#
# Only MCUboot releasing the M4 via RCC_GCR.BOOT_C2, at the correct offset,
# after verification, makes a headered image in slot2 bootable. Raise this to 2
# in the SAME change as the gating, never before.
# CONFIG_UPDATEABLE_IMAGE_NUMBER=2

# --- FIELD RECOVERY: serial recovery over USB CDC (DFU_MASTER_PLAN §6) ---
#
# Without this, the ONLY way back from a bad-but-validly-signed image is SWD,
# because overwrite-only mode has no revert (the secondary slot is on a
# different flash device, so swap is impossible). That makes a bad release an
# RMA event, which is not shippable.
#
# Two entry points, both without a hardware button (the board has none wired):
#   BOOT_SERIAL_NO_APPLICATION -- no bootable image in slot0 (erased, corrupt,
#       interrupted factory programming) => stay in recovery. Costs nothing on
#       a healthy boot: the check is the one MCUboot already performs.
#   BOOT_SERIAL_BOOT_MODE      -- the app (or Studio, via group-64 0x00A5) sets
#       the retained boot-mode flag and reboots. See
#       boards/protocentral/healthypi6_v5/healthypi6_v5_bootmode.dtsi.
#
# NOT enabled: BOOT_SERIAL_WAIT_FOR_DFU. It would also catch an image that
# boots and then hangs, but at the price of a USB enumeration + delay on EVERY
# boot (the host briefly sees a second device). Deliberate trade: that failure
# mode falls back to SWD.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
# BOOT_SERIAL_ENTRANCE_GPIO is `default y` and hard-errors without an
# `mcuboot_button0` DT alias ("Serial recovery/USB DFU button must be declared
# in device tree"). This board has no recovery button wired, which is exactly
# why the two entry methods above were chosen. Turn it off explicitly.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# The retained flag BOOT_SERIAL_BOOT_MODE reads. Backup SRAM (D3, VBAT-backed)
# via the retained-ram driver; the DT node is in the shared bootmode dtsi, which
# BOTH images include so the address and validation match.
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
# Must init after the backup-SRAM driver (PRE_KERNEL_1 prio 90), which enables
# the D3 clock and backup regulator. The stock 40/86 defaults come first and the
# init-priority check fails the build. Same override as prj.signed.conf.
CONFIG_RETAINED_MEM_INIT_PRIORITY=91
CONFIG_RETENTION_INIT_PRIORITY=92

# The recovery CDC port. Kept distinct from the application's composite so a
# unit sitting in recovery is unmistakable in the host's device list.
CONFIG_USB_DEVICE_PRODUCT="HealthyPi 6 Recovery"
CONFIG_USB_DEVICE_MANUFACTURER="Protocentral"
# Same VID/PID as the application (app_m7/prj.prod.conf). pid.codes allocates
# one PID per entry, and recovery = application PID + 1 would have meant using
# 0xFF91, which is not ours.
#
# Nothing depends on them differing. The product string above and the descriptor
# shape (a SINGLE CDC ACM port here, a composite in the application) are visible
# to a human, and a tool that must be certain asks the protocol instead -- the
# application answers group 64, this does not.
#
# PROVISIONAL, and must move together with app_m7/prj.prod.conf if the pid.codes
# allocation comes back different — grep 0xFF90.
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0xFF90

# --- the secondary slots live on the external QSPI NOR, so MCUboot itself
#     needs that flash driver available at boot time ---
CONFIG_FLASH=y
CONFIG_FLASH_STM32_QSPI=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Keep the bootloader small + quiet (128 KB boot_partition budget).
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_BOOT_BANNER=n

# --- the bootloader needs flash + console + IWDG only: switch off the app's
#     custom drivers, which `default y` off their DT nodes and `select`
#     I2C/SENSOR (so the buses must be cut here, at the driver symbols, not at
#     CONFIG_I2C/SENSOR — select wins over =n). The Kconfig-less DT-gated
#     healthybridge SPI driver is disabled in healthypi6_v5_mcuboot_boot.overlay. ---
CONFIG_SENSOR_AFE4400=n
CONFIG_BMI323_I2C=n
CONFIG_MP2696=n
CONFIG_HEALTHYLINK=n
CONFIG_SENSOR=n
CONFIG_I2C=n
CONFIG_SPI=n
CONFIG_ADC=n
CONFIG_DISPLAY=n
CONFIG_INPUT=n
