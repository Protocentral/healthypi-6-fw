# HealthyPi 6 — display/UI measuring fragment.
#
#     HPI_EXTRA_CONF=disp_debug.conf scripts/build.sh m7 dev
#
# Layered on top of prj.dev.conf + disp_conf.conf. This is the build that was
# used to size CONFIG_LV_Z_MEM_POOL_SIZE on v5: it turns on the
# LVGL heap high-water report that ui_module.c's ui_trace() prints per screen
# and twice a second while running. Re-run it after any screen is added or
# reworked — the pool is sized from a measurement, and only this build takes it.
#
# NOT for shipping: costs flash, RAM and time.

# A backtrace on fault. Without it a Cortex-M7 imprecise data bus error gives
# only a PC that is already past the offending store.
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_THREAD_NAME=y

# CONFIG_ASSERT is deliberately NOT enabled here. It panics during boot on an
# unrelated upstream check in the RPMSG static-vrings backend:
#   ASSERTION FAIL [(4 % sys_cache_data_line_size_get()) == 0U]
#   ipc_rpmsg_static_vrings.c:788  "VDEV status area must be aligned to the
#   cache line"
# The 4-byte VDEV status area cannot satisfy a 32-byte D-cache line, and the
# ipc0 region is mapped nocache anyway, so the check is moot for us -- but it is
# fatal, and it fires before the UI thread ever starts. LVGL's own LV_ASSERT_*
# does not go through CONFIG_ASSERT, so we lose nothing here.

# LVGL warnings on top of the errors disp_conf.conf already enables.
# LV_Z_LOG_LEVEL is derived from LV_LOG_LEVEL_* — do not set it directly.
CONFIG_LV_LOG_LEVEL_WARN=y

# Structural asserts: catch a corrupted object/style at the point of use rather
# than three frames later inside a memcpy.
CONFIG_LV_USE_ASSERT_OBJ=y
CONFIG_LV_USE_ASSERT_STYLE=y

# The point of this fragment: makes lvgl_heap_stats() return real numbers, which
# is what ui_trace() reports.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Catch a heap overflow at the write, not at the eventual free. The shipping
# build runs SYS_HEAP_HARDENING_BASIC, whose only check is a header round-trip
# done when a chunk is freed -- so it reports "heap corruption (buffer
# overflow?)" at whatever block happens to be freed next, which is rarely the
# one that was overwritten and tells you nothing about the writer. FULL adds a
# per-chunk canary verified on every free, and MEM_INTEGRITY makes LVGL walk its
# own heap at each lv_malloc. Both are slow; that is the trade.
CONFIG_SYS_HEAP_HARDENING_FULL=y
CONFIG_LV_USE_ASSERT_MEM_INTEGRITY=y

# The screen auto-cycle lives in app_m7/disp_cycle.conf, not here — it takes
# navigation away from the user and so fights any bug reproduced by hand. Add it
# when measuring the heap high-water across the whole screen set:
#     HPI_EXTRA_CONF="disp_debug.conf;disp_cycle.conf" scripts/build.sh m7 dev
