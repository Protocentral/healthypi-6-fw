# Developer flavor. Build with:  FLAVOR=dev scripts/build.sh m7
#
# UART SHELL DISABLED. The interactive shell on the console UART
# (usart1) was unreliable -- RX would not service typed input cleanly while
# sharing the line with logging. For now the console UART is TX-only for debug
# (log output), with NO shell. The shell will be reinstated later on a
# dedicated USB CDC ACM backend, where it does not share the log line.
# The shell adapter (control/shell_hpi/shell_hpi.c) stays in the tree, dormant,
# compiled only when CONFIG_SHELL=y.
#
# Logging is left in IMMEDIATE mode (from the base prj.conf) so the last lines
# before a fault are flushed -- safe now that nothing shares RX with the UART.

CONFIG_HPI_DEV_MODE=y
# INF default. All app modules register at explicit LOG_LEVEL_INF, so a DEBUG
# default adds nothing for our code -- it only turns on DBG spam from
# third-party modules (spi_stm32 reg/transfer dumps, mpu region programming,
# i2c timing, kernel tick/mutex). spi_stm32 in particular registers bare
# (no CONFIG_SPI_LOG_LEVEL), so the only lever for it is this default. Bump a
# specific module back to DBG locally when you actually need to trace it.
CONFIG_LOG_DEFAULT_LEVEL=3
# Pin the chatty MPU/kernel/sensor modules to WARN (stricter than the INF
# default) so even their INF lines stay quiet.
CONFIG_MPU_LOG_LEVEL_WRN=y
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_SENSOR_LOG_LEVEL_WRN=y

# Shell intentionally OFF on UART (it lives on the USB CDC backend).
CONFIG_SHELL=n

# Prove the sample bus on real hardware at boot (logs a PASS/FAIL line).
CONFIG_HPI_BUS_SELFTEST=y

# Log live ECG/PPG frame rates once a second (proves acquisition -> bus).
CONFIG_HPI_ACQ_DEBUG=y

# Keep thread names (useful in logs + fault dumps); thread analyzer output is
# OFF -- it was used to find the mbox_wq near-overflow and is too
# noisy to leave on. Re-enable CONFIG_THREAD_ANALYZER(+_AUTO) temporarily if a
# stack/CPU sweep is needed again.
CONFIG_THREAD_NAME=y

# Connectivity bring-up logging: 5 s SPI-link stats line
# ("conn 5s: ECG=.. PPG=.. vitals=.. sent | drops=..") + the HealthyBridge SPI
# driver's verbose init/transfer lines. Off in prod.
CONFIG_HPI_CONN_DEBUG=y
CONFIG_HEALTHYBRIDGE_ESP32_DEBUG=y

# --- NPU (HealthyLink Compute STM32N657) transport: SPI4 ---
# The SPI4 boot-loop turned out to be a hardware fault (since resolved), not
# the soft-NSS/clock software issue originally suspected. So the NPU runs on
# its native SPI4 link and the USART2 fallback is retired:
#   1. USART2 transport OFF (explicit; it was the parked replacement).
#   2. SPI4 STATUS + GET_INFO comms check ON. Runs off the boot path on the
#      low-prio "npu_comms" work queue, only when an HealthyLink Compute module is
#      detected (CS = PE4 driven as a plain GPIO; see mod_npu.c). Result shows
#      in the boot log and via the NPU module selftest.
CONFIG_HPI_NPU_UART=n
# SPI4 bus PROVEN: the boot-loop was a physical SCK<->VDD short on
# the main board; once removed, spi_transceive completes (rc=0) and the N657
# responds. Loopback no longer needed. Comms check ON. (Still at 1 MHz with the
# npu_xfer probe logs while the N657 response framing is sorted out -- the
# payload decodes wrong, e.g. GET_INFO input=19201 vs expected 876.)
CONFIG_HPI_NPU_COMMS_CHECK=y
