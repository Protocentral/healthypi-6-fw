[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protocentral-healthypi"
version = "0.1.0"
# Distribution name is protocentral-healthypi; the import package is
# `healthypi` and the console scripts are `healthypi` / `hpi`.
description = "Host library and CLI for HealthyPi 6 — .HP6 decoding, MCUmgr group 64, firmware update"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ProtoCentral Electronics" }]
keywords = ["healthypi", "ecg", "ppg", "mcumgr", "smp", "zephyr"]

# Deliberately empty. healthypi.hp6 and healthypi.smp.catalog are stdlib-only so
# that offline decoding and the firmware drift check never need a device stack
# installed. Everything that talks to hardware lives behind an extra.
dependencies = ["smpgroup>=0.1"]

[project.optional-dependencies]
device = ["smpgroup[smp]>=0.1", "smpclient>=2.0", "pyserial>=3.5", "cryptography>=42"]
analysis = ["pyarrow>=15"]
dev = ["pytest>=8"]

[project.scripts]
healthypi = "healthypi.cli.main:main"
hpi = "healthypi.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hw: requires a connected HealthyPi 6 (pass --port)"]
