description: AFE4400 SPI Device

compatible: "ti,afe4400"

include: [sensor-device.yaml, spi-device.yaml]

properties:
  pwdn-gpios:
    type: phandle-array
    required: true
    description: |
      Powerdown pin required
  drdy-gpios:
    type: phandle-array
    required: true
    description: |
      Data-ready interrupt GPIO used to signal when a new conversion/result
      is available from the device.
  reset-gpios:
    type: phandle-array
    required: true
    description: |
      Reset pin used to reset the AFE4400 device. Active low. 